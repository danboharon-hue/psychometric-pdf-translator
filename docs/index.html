<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מבחן פסיכומטרי — כמה מילים תדע?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #e9f3fa;
      --surface: #ffffff;
      --border:  #b8d8ed;
      --accent:  #2a7dc9;
      --accent2: #1a5f9e;
      --text:    #1a2d3d;
      --muted:   #6a8ca0;
      --r:       10px;
      --line-h:  28px;
      --line-c:  #c5dff0;
      --margin-c:#e89090;
    }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text); font-size: 14px;
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(
          transparent 0px,
          transparent calc(var(--line-h) - 1px),
          var(--line-c) calc(var(--line-h) - 1px),
          var(--line-c) var(--line-h)
        ),
        linear-gradient(to left, var(--margin-c) 0px, var(--margin-c) 2px, transparent 2px);
      background-attachment: local;
    }

    /* ══ MAIN ══ */
    .main { height: 100vh; display: flex; }

    /* ══ SETUP ══ */
    .setup {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: rgba(255,255,255,.90);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 34px 36px 36px;
      width: 100%; max-width: 500px;
    }

    .card-title {
      font-size: 20px; font-weight: 800; letter-spacing: -.5px;
      color: var(--accent2); margin-bottom: 5px; line-height: 1.25;
      display: flex; align-items: center; gap: 9px;
    }
    .card-sub {
      color: var(--muted); font-size: 12.5px; margin-bottom: 26px;
      line-height: 1.55; padding-right: 2px;
    }

    /* ── Word list cards ── */
    .wl-label {
      font-size: 11px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .wl-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;
    }
    .wl-card {
      position: relative; cursor: pointer;
      border: 2px solid var(--border); border-radius: 11px;
      padding: 14px 13px 13px;
      background: var(--surface);
      transition: border-color .15s, background .15s;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .wl-card:hover  { border-color: var(--accent); }
    .wl-card.sel    { border-color: var(--accent); background: #eef6fd; }
    .wl-card input  { position: absolute; opacity: 0; pointer-events: none; }
    .wl-icon-wrap {
      width: 38px; height: 38px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: #dbeafe;
    }
    .wl-card.sel .wl-icon-wrap { background: #bfdbfe; }
    .wl-name { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .wl-desc { font-size: 10.5px; color: var(--muted); line-height: 1.35; }
    .wl-badge {
      margin-top: 2px; display: inline-block; font-size: 9.5px; font-weight: 700;
      background: #dbeafe; color: var(--accent2);
      padding: 1px 8px; border-radius: 99px; border: 1px solid #bfdbfe;
    }
    .wl-card.sel .wl-badge { background: var(--accent2); color: #fff; border-color: var(--accent2); }

    .divider { height: 1px; background: var(--border); margin: 2px 0 18px; opacity: .6; }

    .field { margin-bottom: 14px; }

    /* Source tabs */
    .src-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
    .src-main-tab {
      font-size: 13px; font-weight: 700; color: var(--accent2);
      cursor: pointer; padding-bottom: 2px;
      border-bottom: 2px solid var(--accent2);
      white-space: nowrap;
    }
    .src-main-tab.inactive {
      color: var(--muted); border-bottom-color: transparent; font-weight: 500;
    }
    .src-main-tab.inactive:hover { color: var(--accent); }
    .src-alt-tab {
      font-size: 12px; font-weight: 500; color: var(--muted);
      cursor: pointer; padding-bottom: 2px;
      border-bottom: 2px solid transparent;
      background: none; border-left: none; border-right: none; border-top: none;
      font-family: inherit; transition: color .15s;
    }
    .src-alt-tab:hover { color: var(--accent); }
    .src-alt-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); font-weight: 700; }

    .pdf-panel { display: none; } .pdf-panel.active { display: block; }

    .pdf-list {
      display: flex; flex-direction: column; gap: 5px;
      max-height: 210px; overflow-y: auto;
      padding-left: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .pdf-list::-webkit-scrollbar { width: 5px; }
    .pdf-list::-webkit-scrollbar-track { background: transparent; }
    .pdf-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    .pdf-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 9px;
      cursor: pointer; transition: border-color .15s; background: var(--surface);
    }
    .pdf-item:hover { border-color: var(--accent); }
    .pdf-item.sel   { border-color: var(--accent); background: #eef6fd; }
    .pdf-item input { display: none; }
    .rdot {
      width: 14px; height: 14px; border: 2px solid #bbb; border-radius: 50%;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .rdot::after {
      content:''; width:6px; height:6px; border-radius:50%;
      background: var(--accent); opacity:0; transition:opacity .15s;
    }
    .pdf-item.sel .rdot { border-color: var(--accent); }
    .pdf-item.sel .rdot::after { opacity: 1; }
    .pdf-name { font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .drop {
      border: 1px dashed var(--border); border-radius: var(--r); padding: 18px 20px;
      text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
      position: relative; background: var(--surface);
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: #eef6fd; }
    .drop input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .drop-txt  { color: var(--muted); font-size: 12px; }
    .drop-hint { font-size: 11px; color: var(--muted); margin-top: 2px; opacity: .65; }
    .drop-file { color: var(--text); font-size: 12px; margin-top: 5px; font-weight: 500; }

    .proc-btn {
      width: 100%; height: 42px; margin-top: 20px;
      background: var(--accent);
      color: #fff; border: none; border-radius: var(--r);
      font-size: 14px; font-weight: 700; letter-spacing: -.1px;
      cursor: pointer; transition: background .15s; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .proc-btn:hover:not(:disabled) { background: var(--accent2); }
    .proc-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ══ ERROR ══ */
    .err {
      display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #fff1f2; border: 1px solid #fecaca; color: #dc2626;
      padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 300; white-space: nowrap;
    }
    .err.on { display: block; }
  </style>
</head>
<body>

<div class="main">
  <div class="setup" id="setup">
    <div class="card">

      <div class="card-title">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="2" y="3" width="8" height="16" rx="2" fill="#bfdbfe"/>
          <rect x="12" y="3" width="8" height="16" rx="2" fill="#bfdbfe"/>
          <rect x="9.5" y="2" width="3" height="18" rx="1.5" fill="#93c5fd"/>
          <line x1="4" y1="7" x2="8" y2="7" stroke="#2a7dc9" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="4" y1="10" x2="8" y2="10" stroke="#2a7dc9" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="4" y1="13" x2="8" y2="13" stroke="#2a7dc9" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="14" y1="7" x2="18" y2="7" stroke="#2a7dc9" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="14" y1="10" x2="18" y2="10" stroke="#2a7dc9" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="14" y1="13" x2="18" y2="13" stroke="#2a7dc9" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        בחר מבחן פסיכומטרי
      </div>
      <p class="card-sub">הורד קבצים מעובדים מ-GitHub</p>

      <div class="wl-label">בחר רשימת מילים</div>
      <div class="wl-grid">

        <!-- Card 1: NGSL -->
        <label class="wl-card sel" onclick="pickList(this)">
          <input type="radio" name="wlist" value="NGSL" checked>
          <div class="wl-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="7.5" stroke="#2a7dc9" stroke-width="1.6"/>
              <path d="M10 2.5C10 2.5 7.5 5.5 7.5 10s2.5 7.5 2.5 7.5" stroke="#2a7dc9" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M10 2.5C10 2.5 12.5 5.5 12.5 10s-2.5 7.5-2.5 7.5" stroke="#2a7dc9" stroke-width="1.4" stroke-linecap="round"/>
              <line x1="2.5" y1="10" x2="17.5" y2="10" stroke="#2a7dc9" stroke-width="1.4"/>
              <line x1="3.5" y1="6.5" x2="16.5" y2="6.5" stroke="#2a7dc9" stroke-width="1" opacity=".5"/>
              <line x1="3.5" y1="13.5" x2="16.5" y2="13.5" stroke="#2a7dc9" stroke-width="1" opacity=".5"/>
            </svg>
          </div>
          <span class="wl-name">NGSL</span>
          <span class="wl-desc">רשימה בינלאומית שנוצרה על ידי חוקרים</span>
          <span class="wl-badge">2,807 מילים</span>
        </label>

        <!-- Card 2: Psychometric -->
        <label class="wl-card" onclick="pickList(this)">
          <input type="radio" name="wlist" value="מילון הפסיכומטרי של המדינה">
          <div class="wl-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="3.5" y="2" width="11" height="14.5" rx="2" stroke="#2a7dc9" stroke-width="1.6"/>
              <line x1="6" y1="6" x2="12" y2="6" stroke="#2a7dc9" stroke-width="1.4" stroke-linecap="round"/>
              <line x1="6" y1="9" x2="12" y2="9" stroke="#2a7dc9" stroke-width="1.4" stroke-linecap="round"/>
              <line x1="6" y1="12" x2="9" y2="12" stroke="#2a7dc9" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="15" cy="15" r="4" fill="#2a7dc9"/>
              <path d="M12.8 15l1.5 1.5 2.5-2.5" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="wl-name">מילון הפסיכומטרי של המדינה</span>
          <span class="wl-desc">רשימת מילים מהפסיכומטרי</span>
          <span style="font-size:9.5px;color:var(--muted);opacity:.8;">(לא מכיל מילים בסיסיות)</span>
          <span class="wl-badge">3,517 מילים</span>
        </label>

      </div>

      <div class="divider"></div>

      <div class="field">
        <div class="src-row">
          <span class="src-main-tab" id="tabPreLabel" onclick="activateTab('pre')">הורדת קבצים</span>
        </div>

        <div class="pdf-panel active" id="panel-pre">
          <div class="pdf-list" id="pdf-list">
          </div>
        </div>
      </div>

      <button class="proc-btn" id="procBtn" onclick="downloadFile()">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <path d="M6.5 2v7M3.5 6.5l3 3 3-3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 11h9" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        הורד
      </button>

    </div>
  </div>
</div>

<div class="err" id="err"></div>

<script>
  const REPO = "danboharon-hue/psychometric-pdf-translator";
  const BRANCH = "master";

  const psychometricFiles = [
    "פסיכומטרי אביב 2022 פרק 1",
    "פסיכומטרי אביב 2022 פרק 2",
    "פסיכומטרי אביב 2025 פרק 1",
    "פסיכומטרי אביב 2025 פרק 2",
    "פסיכומטרי חורף 2022 פרק 1",
    "פסיכומטרי חורף 2022 פרק 2",
    "פסיכומטרי חורף 2023 פרק 1",
    "פסיכומטרי חורף 2023 פרק 2",
    "פסיכומטרי חורף 2024 פרק 1",
    "פסיכומטרי חורף 2024 פרק 2",
    "פסיכומטרי חורף 2025 פרק 1",
    "פסיכומטרי חורף 2025 פרק 2",
    "פסיכומטרי סתיו 2024 פרק 1",
    "פסיכומטרי סתיו 2024 פרק 2",
    "פסיכומטרי סתיו 2025 פרק 1",
    "פסיכומטרי סתיו 2025 פרק 2",
    "פסיכומטרי קיץ 2022 פרק 1",
    "פסיכומטרי קיץ 2022 פרק 2",
    "פסיכומטרי קיץ 2023 פרק 1",
    "פסיכומטרי קיץ 2023 פרק 2",
    "פסיכומטרי קיץ 2024 פרק 1",
    "פסיכומטרי קיץ 2024 פרק 2",
    "פסיכומטרי קיץ 2025 פרק 1",
    "פסיכומטרי קיץ 2025 פרק 2"
  ];

  let selectedWordList = "NGSL";
  let selectedPdf = "";

  function pickList(card) {
    document.querySelectorAll('.wl-card').forEach(x => x.classList.remove('sel'));
    card.classList.add('sel');
    const val = card.querySelector('input').value;
    card.querySelector('input').checked = true;
    selectedWordList = val;
    loadPdfList(val);
  }

  function activateTab(t) {
    // Only one tab, no need to toggle
  }

  function loadPdfList(wordList) {
    const folderName = wordList === "NGSL" ? "NGSL" : "מילון_הפסיכומטרי_של_המדינה";
    const list = document.getElementById('pdf-list');
    list.innerHTML = '';

    psychometricFiles.forEach((file, index) => {
      const item = document.createElement('div');
      item.className = 'pdf-item ' + (index === 0 ? 'sel' : '');
      item.onclick = () => pickPre(item, file);

      item.innerHTML = `
        <input type="radio" name="pre" value="${file}" ${index === 0 ? 'checked' : ''}>
        <div class="rdot"></div>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0">
          <rect x="2" y="1" width="9" height="12" rx="1.5" stroke="#6a8ca0" stroke-width="1.3"/>
          <path d="M5 1v3.5h4" stroke="#6a8ca0" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="4" y1="7" x2="10" y2="7" stroke="#6a8ca0" stroke-width="1" stroke-linecap="round"/>
          <line x1="4" y1="9.5" x2="8" y2="9.5" stroke="#6a8ca0" stroke-width="1" stroke-linecap="round"/>
        </svg>
        <span class="pdf-name">${file}</span>
      `;
      list.appendChild(item);
    });

    if (psychometricFiles.length > 0) {
      selectedPdf = psychometricFiles[0];
    }
  }

  function pickPre(el, name) {
    document.querySelectorAll('.pdf-item').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    el.querySelector('input').checked = true;
    selectedPdf = name;
  }

  function downloadFile() {
    if (!selectedPdf) {
      showErr('יש לבחור קובץ PDF');
      return;
    }

    const folderName = selectedWordList === "NGSL" ? "NGSL" : "מילון_הפסיכומטרי_של_המדינה";
    const filename = selectedPdf + "_translated.pdf";
    const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/processed/${folderName}/${filename}`;

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 4000);
  }

  // Initialize
  loadPdfList('NGSL');
</script>

</body>
</html>
