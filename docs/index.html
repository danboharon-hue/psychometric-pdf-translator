<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתרגם PDF - הורדה</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; font-weight: 700; }
        .header p { font-size: 1.1em; opacity: 0.95; }
        .content { padding: 40px; }
        .section {
            margin-bottom: 50px;
        }
        .section h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .pdf-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .pdf-item:hover {
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }
        .pdf-name {
            font-size: 1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            word-break: break-word;
        }
        .download-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .download-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .stats-box {
            background: #f0f4ff;
            border-left: 5px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .stats-box h3 { color: #333; margin-bottom: 8px; }
        .stats-box p { color: #666; margin: 4px 0; font-size: 0.95em; }

        /* PDF Viewer */
        .pdf-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .pdf-viewer.on {
            display: flex;
        }
        .pdf-viewer-container {
            background: white;
            border-radius: 16px;
            width: 100%;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .pdf-viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
            border-bottom: 1px solid #e9ecef;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 16px 16px 0 0;
        }
        .pdf-viewer-title {
            font-weight: 600;
            font-size: 1.1em;
        }
        .pdf-viewer-close {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-size: 24px;
            transition: all 0.2s;
        }
        .pdf-viewer-close:hover {
            background: rgba(255,255,255,0.3);
        }
        .pdf-viewer-content {
            flex: 1;
            overflow: hidden;
        }
        .pdf-viewer-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 מתרגם PDF פסיכומטרי</h1>
            <p>כל המסמכים מעובדים מראש וערכים להורדה</p>
        </div>

        <div class="content">
            <div class="stats-box">
                <h3>✅ עיבוד הושלם בהצלחה!</h3>
                <p><strong>סה"כ קבצים עובדים:</strong> 24 מסמכים × 2 רשימות מילים = 48 קבצים</p>
                <p><strong>אחסון:</strong> GitHub Repository</p>
            </div>

            <div class="section" id="section-1">
                <h2>📖 מילון הפסיכומטרי של המדינה (24 קבצים)</h2>
                <div class="pdf-grid" id="grid-1"></div>
            </div>

            <div class="section" id="section-2">
                <h2>📖 NGSL (24 קבצים)</h2>
                <div class="pdf-grid" id="grid-2"></div>
            </div>
        </div>
    </div>

    <!-- PDF Viewer -->
    <div class="pdf-viewer" id="pdfViewer">
        <div class="pdf-viewer-container">
            <div class="pdf-viewer-header">
                <span class="pdf-viewer-title" id="pdfTitle"></span>
                <button class="pdf-viewer-close" onclick="closePdfViewer()">✕</button>
            </div>
            <div class="pdf-viewer-content">
                <iframe id="pdfFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        const REPO = "danboharon-hue/psychometric-pdf-translator";
        const BRANCH = "master";

        const psychometricFiles = [
            "פסיכומטרי אביב 2022 פרק 1",
            "פסיכומטרי אביב 2022 פרק 2",
            "פסיכומטרי אביב 2025 פרק 1",
            "פסיכומטרי אביב 2025 פרק 2",
            "פסיכומטרי חורף 2022 פרק 1",
            "פסיכומטרי חורף 2022 פרק 2",
            "פסיכומטרי חורף 2023 פרק 1",
            "פסיכומטרי חורף 2023 פרק 2",
            "פסיכומטרי חורף 2024 פרק 1",
            "פסיכומטרי חורף 2024 פרק 2",
            "פסיכומטרי חורף 2025 פרק 1",
            "פסיכומטרי חורף 2025 פרק 2",
            "פסיכומטרי סתיו 2024 פרק 1",
            "פסיכומטרי סתיו 2024 פרק 2",
            "פסיכומטרי סתיו 2025 פרק 1",
            "פסיכומטרי סתיו 2025 פרק 2",
            "פסיכומטרי קיץ 2022 פרק 1",
            "פסיכומטרי קיץ 2022 פרק 2",
            "פסיכומטרי קיץ 2023 פרק 1",
            "פסיכומטרי קיץ 2023 פרק 2",
            "פסיכומטרי קיץ 2024 פרק 1",
            "פסיכומטרי קיץ 2024 פרק 2",
            "פסיכומטרי קיץ 2025 פרק 1",
            "פסיכומטרי קיץ 2025 פרק 2"
        ];

        function createDownloadLink(filename, folder) {
            const rawUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/processed/${folder}/${filename}_translated.pdf`;
            return rawUrl;
        }

        function renderGrid(files, folder, gridId) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            files.forEach(file => {
                const url = createDownloadLink(file, folder);
                const item = document.createElement('div');
                item.className = 'pdf-item';
                item.onclick = () => viewPdf(file, url);
                item.innerHTML = `
                    <div class="pdf-name">${file}</div>
                    <button class="download-btn">📖 הצג</button>
                `;
                grid.appendChild(item);
            });
        }

        function viewPdf(filename, url) {
            document.getElementById('pdfTitle').textContent = filename;
            document.getElementById('pdfFrame').src = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(url)}`;
            document.getElementById('pdfViewer').classList.add('on');
        }

        function closePdfViewer() {
            document.getElementById('pdfViewer').classList.remove('on');
            document.getElementById('pdfFrame').src = '';
        }

        // Render both grids
        renderGrid(psychometricFiles, "מילון_הפסיכומטרי_של_המדינה", "grid-1");
        renderGrid(psychometricFiles, "NGSL", "grid-2");
    </script>
</body>
</html>
