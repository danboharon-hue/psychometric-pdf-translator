<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתרגם PDF פסיכומטרי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 50px;
        }

        .section h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .pdf-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .pdf-item:hover {
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .pdf-name {
            font-size: 1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .pdf-link {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .pdf-link:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .stats-box {
            background: #f0f4ff;
            border-left: 5px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .stats-box h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .stats-box p {
            color: #666;
            margin: 4px 0;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>מתרגם PDF פסיכומטרי</h1>
            <p>כל המסמכים מעובדים מראש וערכים להורדה</p>
        </div>

        <div class="content">
            <div class="stats-box">
                <h3>✓ עיבוד הושלם בהצלחה!</h3>
                <p><strong>סה"כ קבצים עובדים:</strong> 24 מסמכים × 2 רשימות מילים = 48 קבצים</p>
                <p><strong>כל החישובים כבר בוצעו - רק הצגה סטטית</strong></p>
            </div>

            <div class="section">
                <h2>מילון הפסיכומטרי של המדינה (24 קבצים)</h2>
                <div class="pdf-grid" id="grid-1"></div>
            </div>

            <div class="section">
                <h2>NGSL (24 קבצים)</h2>
                <div class="pdf-grid" id="grid-2"></div>
            </div>
        </div>
    </div>

    <script>
        const psychometricFiles = [
            "פסיכומטרי אביב 2022 פרק 1",
            "פסיכומטרי אביב 2022 פרק 2",
            "פסיכומטרי אביב 2025 פרק 1",
            "פסיכומטרי אביב 2025 פרק 2",
            "פסיכומטרי חורף 2022 פרק 1",
            "פסיכומטרי חורף 2022 פרק 2",
            "פסיכומטרי חורף 2023 פרק 1",
            "פסיכומטרי חורף 2023 פרק 2",
            "פסיכומטרי חורף 2024 פרק 1",
            "פסיכומטרי חורף 2024 פרק 2",
            "פסיכומטרי חורף 2025 פרק 1",
            "פסיכומטרי חורף 2025 פרק 2",
            "פסיכומטרי סתיו 2024 פרק 1",
            "פסיכומטרי סתיו 2024 פרק 2",
            "פסיכומטרי סתיו 2025 פרק 1",
            "פסיכומטרי סתיו 2025 פרק 2",
            "פסיכומטרי קיץ 2022 פרק 1",
            "פסיכומטרי קיץ 2022 פרק 2",
            "פסיכומטרי קיץ 2023 פרק 1",
            "פסיכומטרי קיץ 2023 פרק 2",
            "פסיכומטרי קיץ 2024 פרק 1",
            "פסיכומטרי קיץ 2024 פרק 2",
            "פסיכומטרי קיץ 2025 פרק 1",
            "פסיכומטרי קיץ 2025 פרק 2"
        ];

        function createDownloadLink(filename, folder) {
            return `https://github.com/danboharon-hue/psychometric-pdf-translator/raw/master/processed/${folder}/${filename}_translated.pdf`;
        }

        function renderGrid(files, folder, gridId) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            files.forEach(file => {
                const url = createDownloadLink(file, folder);
                const item = document.createElement('div');
                item.className = 'pdf-item';
                item.innerHTML = `
                    <div class="pdf-name">${file}</div>
                    <a href="${url}" class="pdf-link" download>הורד PDF</a>
                `;
                grid.appendChild(item);
            });
        }

        // Render both grids
        renderGrid(psychometricFiles, "מילון_הפסיכומטרי_של_המדינה", "grid-1");
        renderGrid(psychometricFiles, "NGSL", "grid-2");
    </script>
</body>
</html>
