<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מתרגם PDF פסיכומטרי</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #e9f3fa;
      --surface: #ffffff;
      --border:  #b8d8ed;
      --accent:  #2a7dc9;
      --accent2: #1a5f9e;
      --text:    #1a2d3d;
      --muted:   #6a8ca0;
      --r:       10px;
      --line-h:  28px;
      --line-c:  #c5dff0;
      --margin-c:#e89090;
    }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text); font-size: 14px;
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(
          transparent 0px,
          transparent calc(var(--line-h) - 1px),
          var(--line-c) calc(var(--line-h) - 1px),
          var(--line-c) var(--line-h)
        ),
        linear-gradient(to left, var(--margin-c) 0px, var(--margin-c) 2px, transparent 2px);
      background-attachment: local;
    }

    .main {
      max-width: 1000px; margin: 0 auto; padding: 60px 30px 30px;
    }

    .header {
      margin-bottom: 50px;
    }

    .header-title {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 8px;
    }

    .header-title svg {
      width: 32px; height: 32px; opacity: 0.8;
    }

    .header-title h1 {
      font-size: 28px; font-weight: 700; color: var(--accent2);
    }

    .header-subtitle {
      color: var(--muted); font-size: 13px; margin-right: 44px;
    }

    .section {
      margin-bottom: 60px;
    }

    .section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 16px; font-weight: 700; color: var(--accent2);
      margin-bottom: 20px; padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }

    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .pdf-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px; cursor: pointer;
      transition: all 0.2s ease;
      display: flex; flex-direction: column; gap: 12px;
    }

    .pdf-card:hover {
      border-color: var(--accent); box-shadow: 0 4px 12px rgba(42, 125, 201, 0.12);
      transform: translateY(-1px);
    }

    .pdf-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #93c5fd 0%, #60a5fa 100%);
      border-radius: 6px; flex-shrink: 0;
    }

    .pdf-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      line-height: 1.3;
    }

    .pdf-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; background: var(--accent); color: white;
      border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: background 0.15s;
      font-family: inherit;
    }

    .pdf-link:hover {
      background: var(--accent2);
    }

    .info-box {
      background: #f0fdf4; border: 1px solid #86efac; border-radius: var(--r);
      padding: 16px; margin-bottom: 30px; font-size: 13px; color: var(--text);
    }

    .info-box strong { color: #15803d; }
  </style>
</head>
<body>

<div class="main">
  <div class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4" width="9" height="16" rx="1.5" fill="currentColor" opacity="0.3"/>
        <rect x="12" y="4" width="9" height="16" rx="1.5" fill="currentColor" opacity="0.3"/>
        <rect x="9.5" y="3" width="5" height="18" rx="1.5" fill="currentColor"/>
      </svg>
      <h1>מתרגם PDF פסיכומטרי</h1>
    </div>
    <p class="header-subtitle">48 קבצים מעובדים וערוכים להורדה</p>
  </div>

  <div class="info-box">
    <strong>✅ עיבוד הושלם בהצלחה!</strong><br/>
    24 מבחני פסיכומטרי × 2 רשימות מילים = 48 קבצים PDF מעובדים
  </div>

  <div class="section">
    <div class="section-title">
      <span>📖</span>
      <span id="heading-1">מילון הפסיכומטרי של המדינה</span>
      <span style="color: var(--muted); font-weight: 400; margin-right: auto;">(24 קבצים)</span>
    </div>
    <div class="pdf-grid" id="grid-1"></div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>📖</span>
      <span id="heading-2">NGSL</span>
      <span style="color: var(--muted); font-weight: 400; margin-right: auto;">(24 קבצים)</span>
    </div>
    <div class="pdf-grid" id="grid-2"></div>
  </div>
</div>

<script>
  const REPO = "danboharon-hue/psychometric-pdf-translator";
  const BRANCH = "master";

  const psychometricFiles = [
    "פסיכומטרי אביב 2022 פרק 1",
    "פסיכומטרי אביב 2022 פרק 2",
    "פסיכומטרי אביב 2025 פרק 1",
    "פסיכומטרי אביב 2025 פרק 2",
    "פסיכומטרי חורף 2022 פרק 1",
    "פסיכומטרי חורף 2022 פרק 2",
    "פסיכומטרי חורף 2023 פרק 1",
    "פסיכומטרי חורף 2023 פרק 2",
    "פסיכומטרי חורף 2024 פרק 1",
    "פסיכומטרי חורף 2024 פרק 2",
    "פסיכומטרי חורף 2025 פרק 1",
    "פסיכומטרי חורף 2025 פרק 2",
    "פסיכומטרי סתיו 2024 פרק 1",
    "פסיכומטרי סתיו 2024 פרק 2",
    "פסיכומטרי סתיו 2025 פרק 1",
    "פסיכומטרי סתיו 2025 פרק 2",
    "פסיכומטרי קיץ 2022 פרק 1",
    "פסיכומטרי קיץ 2022 פרק 2",
    "פסיכומטרי קיץ 2023 פרק 1",
    "פסיכומטרי קיץ 2023 פרק 2",
    "פסיכומטרי קיץ 2024 פרק 1",
    "פסיכומטרי קיץ 2024 פרק 2",
    "פסיכומטרי קיץ 2025 פרק 1",
    "פסיכומטרי קיץ 2025 פרק 2"
  ];

  function createDownloadLink(filename, folder) {
    const encodedFilename = filename + "_translated.pdf";
    const rawUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/processed/${folder}/${encodedFilename}`;
    return rawUrl;
  }

  function renderGrid(files, folder, gridId) {
    const grid = document.getElementById(gridId);
    grid.innerHTML = "";

    files.forEach(file => {
      const url = createDownloadLink(file, folder);
      const card = document.createElement('div');
      card.className = 'pdf-card';
      card.innerHTML = `
        <div class="pdf-icon"></div>
        <div class="pdf-name">${file}</div>
        <a href="${url}" class="pdf-link" download>
          <span>⬇️</span>
          <span>הורד</span>
        </a>
      `;
      grid.appendChild(card);
    });
  }

  // Render both grids
  renderGrid(psychometricFiles, "מילון_הפסיכומטרי_של_המדינה", "grid-1");
  renderGrid(psychometricFiles, "NGSL", "grid-2");
</script>

</body>
</html>
